<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
globalThis.require = function(path) {
    if (path.includes('logger')) {
        return { info: function(){}, warn: function(){}, error: function(){} };
    }
    if (path.includes('afp.wasm')) return { WASM_BINARY: WASM_BINARY };
    throw new Error('Unsupported local module: ' + path);
};
</script>
<script src="afp.wasm.js"></script>
<script src="afp.js"></script>
<script>
globalThis.generateFingerprint = async function(pcm) {
    const bytes = Uint8Array.from(atob(pcm), character => character.charCodeAt(0));
    const samples = new Float32Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 4));
    return await GenerateFP(samples);
};
</script>
</body>
</html>
